# Do NOT commit real values. Create the secret out of band, e.g.
#   kubectl -n conference-tracker create secret generic conference-tracker \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=OIDC_CLIENT_SECRET="..."
apiVersion: v1
kind: Secret
metadata:
  name: conference-tracker
  namespace: conference-tracker
type: Opaque
stringData:
  SECRET_KEY: replace-me-with-openssl-rand-hex-32
  POSTGRES_PASSWORD: replace-me
  OIDC_CLIENT_SECRET: replace-me
