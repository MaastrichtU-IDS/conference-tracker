apiVersion: v1
kind: Service
metadata:
  name: conference-tracker-db
  namespace: conference-tracker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: conference-tracker-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: conference-tracker-db
  namespace: conference-tracker
spec:
  serviceName: conference-tracker-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: conference-tracker-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conference-tracker-db
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: tracker
            - name: POSTGRES_DB
              value: tracker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conference-tracker
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tracker", "-d", "tracker"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tracker", "-d", "tracker"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits:   { cpu: "1",  memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
